<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gravity Sandbox — 2D N-Body Simulator</title>
<style>
  :root{
    --bg:#05070d; --panel:#0c1220; --panel2:#101830; --line:#1e2a4a;
    --text:#e8ecf7; --dim:#8a94b8; --accent:#7fd1ff; --accent2:#ffb86b;
    --danger:#ff6b7f; --good:#7fffa0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  #app{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;background:radial-gradient(ellipse at 50% 30%, #0a1024 0%, #05070d 70%);}

  #hud{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;
    display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;pointer-events:none;}
  .panel{background:rgba(12,18,32,.88);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;pointer-events:auto;backdrop-filter:blur(6px);}
  #toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer;transition:.15s;}
  button:hover{background:#182448;border-color:var(--accent);}
  button.active{background:var(--accent);color:#031018;border-color:var(--accent);font-weight:600;}
  button.danger:hover{border-color:var(--danger);}
  #toolbar .sep{width:1px;background:var(--line);align-self:stretch;margin:0 4px;}
  label{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px;}
  input[type=range]{width:90px;accent-color:var(--accent);}
  input[type=number]{width:64px;background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:6px;padding:4px 6px;font-size:12px;}

  #rightPanel{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;width:230px;
    max-height:70vh;overflow-y:auto;}
  #bodyList .row{display:flex;justify-content:space-between;align-items:center;
    font-size:12px;padding:4px 2px;border-bottom:1px solid var(--line);}
  #bodyList .row span{color:var(--dim);}
  #bodyList .row button{padding:2px 6px;font-size:11px;}

  #bottomBar{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px;right:10px;
    display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;pointer-events:none;}
  #bottomBar .panel{pointer-events:auto;}
  #info{font-size:12px;color:var(--dim);line-height:1.5;max-width:420px;}
  #stats{font-size:12px;color:var(--dim);text-align:right;}
  #stats b{color:var(--accent);}

  #dragHint{position:absolute;pointer-events:none;color:var(--accent2);font-size:11px;
    background:rgba(0,0,0,.6);padding:2px 6px;border-radius:4px;display:none;}
</style>
</head>
<body>
<div id="app">
<canvas id="c"></canvas>

<div id="hud">
  <div class="panel" id="toolbar">
    <button data-type="star" class="typeBtn active">⭐ Star</button>
    <button data-type="planet" class="typeBtn">🪐 Planet</button>
    <button data-type="asteroid" class="typeBtn">☄️ Asteroid</button>
    <div class="sep"></div>
    <label>Mass <input id="massInput" type="number" value="500" min="1"></label>
    <div class="sep"></div>
    <button id="playBtn">⏸ Pause</button>
    <button id="clearBtn" class="danger">🗑 Clear</button>
    <button id="trailBtn" class="active">〰 Trails</button>
    <div class="sep"></div>
    <label>Speed <input id="speedRange" type="range" min="0" max="300" value="100"><span id="speedVal">1.0×</span></label>
  </div>
</div>

<div id="rightPanel" class="panel">
  <div style="font-size:12px;color:var(--dim);margin-bottom:6px;">BODIES (<span id="bodyCount">0</span>)</div>
  <div id="bodyList"></div>
</div>

<div id="bottomBar">
  <div class="panel" id="info">
    <b style="color:var(--text)">Click</b> empty space to place a body, then <b style="color:var(--text)">drag</b> before releasing to set its launch velocity.<br>
    Scroll to zoom · Right-click-drag or two-finger drag to pan · Click a body to select/delete it.
  </div>
  <div class="panel" id="stats">
    FPS: <b id="fps">60</b> · Bodies: <b id="statCount">0</b><br>
    Zoom: <b id="zoomStat">1.0×</b>
  </div>
</div>

<div id="dragHint"></div>
</div>

<script>
(function(){
"use strict";
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio; }
resize(); addEventListener('resize', resize);

// ---------- World / physics ----------
const G = 6000; // scaled gravitational constant for visual scale
const SOFTEN = 8; // softening length to avoid singular blowups
let bodies = [];
let running = true;
let timeScale = 1.0;
let showTrails = true;
let idCounter = 1;

const TYPE_PRESETS = {
  star:     { radiusK: 1.0, color: ['#fff3c4','#ffd27f'], glow:true },
  planet:   { radiusK: 0.55, color: ['#7fd1ff','#4f8fd6'], glow:false },
  asteroid: { radiusK: 0.3, color: ['#b7b7b7','#7a7a7a'], glow:false }
};

function radiusForMass(mass, k){
  return Math.max(3, Math.cbrt(mass) * 1.4 * k);
}

function addBody(x, y, vx, vy, mass, type){
  const preset = TYPE_PRESETS[type] || TYPE_PRESETS.planet;
  bodies.push({
    id: idCounter++, x, y, vx, vy, mass, type,
    r: radiusForMass(mass, preset.radiusK),
    color: preset.color, glow: preset.glow,
    trail: [], fixed: false
  });
  refreshBodyList();
}

function removeBody(id){
  bodies = bodies.filter(b => b.id !== id);
  refreshBodyList();
}

// seed with a simple star + orbiting planet
addBody(0, 0, 0, 0, 4000, 'star');
addBody(260, 0, 0, 120, 60, 'planet');
addBody(-420, 60, 10, -95, 20, 'asteroid');

// ---------- Camera ----------
let cam = { x:0, y:0, zoom:1 };
function worldToScreen(x,y){
  return {
    x: canvas.width/2 + (x - cam.x)*cam.zoom,
    y: canvas.height/2 + (y - cam.y)*cam.zoom
  };
}
function screenToWorld(sx,sy){
  return {
    x: (sx - canvas.width/2)/cam.zoom + cam.x,
    y: (sy - canvas.height/2)/cam.zoom + cam.y
  };
}

// ---------- Physics step (semi-implicit Euler, pairwise gravity) ----------
function step(dt){
  const n = bodies.length;
  for(let i=0;i<n;i++){
    let ax=0, ay=0;
    const bi = bodies[i];
    for(let j=0;j<n;j++){
      if(i===j) continue;
      const bj = bodies[j];
      const dx = bj.x - bi.x, dy = bj.y - bi.y;
      const distSq = dx*dx + dy*dy + SOFTEN*SOFTEN;
      const dist = Math.sqrt(distSq);
      const f = G * bj.mass / distSq;
      ax += f * dx/dist;
      ay += f * dy/dist;
    }
    bi.ax = ax; bi.ay = ay;
  }
  for(const b of bodies){
    b.vx += b.ax * dt;
    b.vy += b.ay * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if(showTrails){
      b.trail.push({x:b.x, y:b.y});
      if(b.trail.length > 220) b.trail.shift();
    } else if(b.trail.length){
      b.trail.length = 0;
    }
  }
  // simple merge on collision
  for(let i=0;i<bodies.length;i++){
    for(let j=bodies.length-1;j>i;j--){
      const a = bodies[i], b = bodies[j];
      const dx=a.x-b.x, dy=a.y-b.y;
      if(Math.hypot(dx,dy) < (a.r+b.r)*0.6){
        const totalMass = a.mass + b.mass;
        a.vx = (a.vx*a.mass + b.vx*b.mass)/totalMass;
        a.vy = (a.vy*a.mass + b.vy*b.mass)/totalMass;
        a.x = (a.x*a.mass + b.x*b.mass)/totalMass;
        a.y = (a.y*a.mass + b.y*b.mass)/totalMass;
        a.mass = totalMass;
        const preset = TYPE_PRESETS[a.type] || TYPE_PRESETS.planet;
        a.r = radiusForMass(a.mass, preset.radiusK);
        bodies.splice(j,1);
      }
    }
  }
}

// ---------- Rendering ----------
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#05070d';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // starfield
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for(let i=0;i<80;i++){
    const sx = (i*97 + (cam.x*0.02))%canvas.width;
    const sy = (i*53 + (cam.y*0.02))%canvas.height;
    ctx.globalAlpha = 0.15 + (i%5)*0.06;
    ctx.fillRect((sx+canvas.width)%canvas.width, (sy+canvas.height)%canvas.height, 1.5, 1.5);
  }
  ctx.globalAlpha = 1;

  for(const b of bodies){
    if(showTrails && b.trail.length > 1){
      ctx.beginPath();
      for(let k=0;k<b.trail.length;k++){
        const p = worldToScreen(b.trail[k].x, b.trail[k].y);
        if(k===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
      }
      ctx.strokeStyle = b.color[1];
      ctx.globalAlpha = 0.35;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  for(const b of bodies){
    const p = worldToScreen(b.x, b.y);
    const r = Math.max(1.5, b.r * cam.zoom);
    if(b.glow){
      const grad = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*4);
      grad.addColorStop(0, 'rgba(255,240,180,0.5)');
      grad.addColorStop(1, 'rgba(255,240,180,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(p.x,p.y,r*4,0,7); ctx.fill();
    }
    const g = ctx.createRadialGradient(p.x-r*0.3,p.y-r*0.3,r*0.1,p.x,p.y,r);
    g.addColorStop(0, b.color[0]);
    g.addColorStop(1, b.color[1]);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7); ctx.fill();
    if(b === selectedBody){
      ctx.strokeStyle = '#ffb86b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x,p.y,r+4,0,7); ctx.stroke();
    }
  }

  // drag-to-launch preview
  if(dragStart && dragCurrent){
    const p0 = worldToScreen(dragStart.x, dragStart.y);
    ctx.strokeStyle = '#7fffa0'; ctx.lineWidth = 2; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(dragCurrent.sx, dragCurrent.sy); ctx.stroke();
    ctx.setLineDash([]);
  }
}

// ---------- Main loop ----------
let lastT = performance.now();
let fpsAcc = 0, fpsCount = 0, fpsShown = 60;
function loop(now){
  const rawDt = Math.min(0.05, (now - lastT)/1000);
  lastT = now;
  if(running){
    const sub = 2; // substeps for stability
    for(let s=0;s<sub;s++) step((rawDt*timeScale)/sub);
  }
  draw();
  fpsAcc += rawDt; fpsCount++;
  if(fpsAcc > 0.5){ fpsShown = Math.round(fpsCount/fpsAcc); fpsAcc=0; fpsCount=0; }
  document.getElementById('fps').textContent = fpsShown;
  document.getElementById('statCount').textContent = bodies.length;
  document.getElementById('bodyCount').textContent = bodies.length;
  document.getElementById('zoomStat').textContent = cam.zoom.toFixed(2)+'×';
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- UI wiring ----------
let currentType = 'star';
document.querySelectorAll('.typeBtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.typeBtn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentType = btn.dataset.type;
    const defaults = { star: 4000, planet: 200, asteroid: 15 };
    document.getElementById('massInput').value = defaults[currentType];
  });
});

document.getElementById('playBtn').addEventListener('click', function(){
  running = !running;
  this.textContent = running ? '⏸ Pause' : '▶ Play';
});
document.getElementById('clearBtn').addEventListener('click', ()=>{
  bodies = []; selectedBody = null; refreshBodyList();
});
document.getElementById('trailBtn').addEventListener('click', function(){
  showTrails = !showTrails;
  this.classList.toggle('active', showTrails);
});
document.getElementById('speedRange').addEventListener('input', function(){
  timeScale = this.value/100;
  document.getElementById('speedVal').textContent = timeScale.toFixed(1)+'×';
});

let selectedBody = null;
function refreshBodyList(){
  const list = document.getElementById('bodyList');
  list.innerHTML = '';
  bodies.forEach(b=>{
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span>${b.type} · m=${Math.round(b.mass)}</span>`;
    const del = document.createElement('button');
    del.textContent = '✕';
    del.addEventListener('click', ()=>removeBody(b.id));
    row.appendChild(del);
    list.appendChild(row);
  });
}
refreshBodyList();

// ---------- Pointer interaction: click to place, drag to set velocity, right-drag to pan ----------
let dragStart = null;      // world coords of placed body while dragging velocity
let dragCurrent = null;    // screen coords of current pointer
let pendingBody = null;
let isPanning = false;
let panStart = null;
let camStart = null;

function getScreenPos(e){
  const rect = canvas.getBoundingClientRect();
  const sx = (e.clientX - rect.left) * devicePixelRatio;
  const sy = (e.clientY - rect.top) * devicePixelRatio;
  return {sx, sy};
}

canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('pointerdown', (e)=>{
  const {sx, sy} = getScreenPos(e);
  if(e.button === 2 || e.shiftKey){
    isPanning = true; panStart = {sx,sy}; camStart = {x:cam.x, y:cam.y};
    return;
  }
  const world = screenToWorld(sx, sy);
  // check if clicked existing body -> select
  const hit = bodies.find(b=>{
    const p = worldToScreen(b.x,b.y);
    return Math.hypot(p.x-sx, p.y-sy) < Math.max(8, b.r*cam.zoom+4);
  });
  if(hit){
    selectedBody = (selectedBody===hit) ? null : hit;
    return;
  }
  selectedBody = null;
  dragStart = world;
  dragCurrent = {sx, sy};
});

canvas.addEventListener('pointermove', (e)=>{
  const {sx, sy} = getScreenPos(e);
  if(isPanning){
    cam.x = camStart.x - (sx - panStart.sx)/cam.zoom;
    cam.y = camStart.y - (sy - panStart.sy)/cam.zoom;
    return;
  }
  if(dragStart){
    dragCurrent = {sx, sy};
  }
});

canvas.addEventListener('pointerup', (e)=>{
  if(isPanning){ isPanning = false; return; }
  if(dragStart){
    const worldNow = screenToWorld(dragCurrent.sx, dragCurrent.sy);
    const vx = (dragStart.x - worldNow.x) * 1.2;
    const vy = (dragStart.y - worldNow.y) * 1.2;
    const mass = parseFloat(document.getElementById('massInput').value) || 100;
    addBody(dragStart.x, dragStart.y, vx, vy, mass, currentType);
    dragStart = null; dragCurrent = null;
  }
});

canvas.addEventListener('wheel', (e)=>{
  e.preventDefault();
  const {sx, sy} = getScreenPos(e);
  const before = screenToWorld(sx, sy);
  cam.zoom *= (e.deltaY < 0) ? 1.1 : 0.9;
  cam.zoom = Math.max(0.05, Math.min(8, cam.zoom));
  const after = screenToWorld(sx, sy);
  cam.x += (before.x - after.x);
  cam.y += (before.y - after.y);
}, {passive:false});

// keyboard: delete selected
window.addEventListener('keydown', (e)=>{
  if((e.key === 'Delete' || e.key === 'Backspace') && selectedBody){
    removeBody(selectedBody.id);
    selectedBody = null;
  }
  if(e.key === ' '){ e.preventDefault(); document.getElementById('playBtn').click(); }
});
})();
</script>
</body>
</html>
